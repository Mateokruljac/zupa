# Pastoral župa — deploy na Netlify
# Site settings → Build: publish = pastoral-zupa (ili root ako je base dir)

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  publish = "."
  functions = "netlify/functions"
  port = 8888
  targetPort = 3340
  autoLaunch = false

# SPA nije potreban — statički HTML po stranicama
