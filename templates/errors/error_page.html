<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#214f70">
  <title>{{ error_code }} — {{ page_title }}</title>
  <style>
    :root {
      color-scheme: light;
      --error-background: #eef3f7;
      --error-surface: #fffdfa;
      --error-surface-muted: #f5f7f8;
      --error-primary: #214f70;
      --error-primary-dark: #173b56;
      --error-accent: #b68a24;
      --error-text: #292d30;
      --error-muted: #687078;
      --error-border: #d8dde1;
      --error-shadow: rgba(27, 48, 64, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 12% 8%, rgba(33, 79, 112, 0.12), transparent 28rem),
        radial-gradient(circle at 90% 88%, rgba(182, 138, 36, 0.11), transparent 25rem),
        var(--error-background);
      color: var(--error-text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .error-page {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(18px, 4vw, 52px);
    }

    .error-card {
      display: grid;
      width: min(100%, 980px);
      min-height: 520px;
      grid-template-columns: minmax(280px, 0.86fr) minmax(380px, 1.14fr);
      overflow: hidden;
      border: 1px solid var(--error-border);
      border-radius: 28px;
      background: var(--error-surface);
      box-shadow: 0 28px 80px var(--error-shadow);
    }

    .error-visual {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: clamp(30px, 5vw, 48px);
      background: linear-gradient(150deg, var(--error-primary) 0%, var(--error-primary-dark) 100%);
      color: #ffffff;
    }

    .error-visual::before,
    .error-visual::after {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .error-visual::before {
      top: -112px;
      right: -128px;
      width: 310px;
      height: 310px;
      box-shadow: 0 0 0 48px rgba(255, 255, 255, 0.025);
    }

    .error-visual::after {
      bottom: -86px;
      left: -98px;
      width: 220px;
      height: 220px;
    }

    .error-brand,
    .error-code-wrap {
      position: relative;
      z-index: 1;
    }

    .error-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .error-brand__mark {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.09);
    }

    .error-brand__mark svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 1.8;
    }

    .error-brand__copy {
      display: grid;
      gap: 1px;
    }

    .error-brand__copy small {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .error-brand__copy strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.015em;
    }

    .error-code-wrap {
      margin-top: 64px;
    }

    .error-code-label {
      display: block;
      margin-bottom: 8px;
      color: #dec36e;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .error-code {
      display: block;
      margin-left: -0.05em;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(6rem, 13vw, 9rem);
      font-weight: 600;
      letter-spacing: -0.065em;
      line-height: 0.78;
    }

    .error-content {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: clamp(38px, 6vw, 72px);
    }

    .error-eyebrow {
      margin: 0 0 13px;
      color: var(--error-accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .error-content h1 {
      max-width: 520px;
      margin: 0;
      color: var(--error-primary-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 5vw, 3.7rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 0.98;
    }

    .error-message {
      max-width: 500px;
      margin: 22px 0 0;
      color: var(--error-muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .error-action {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 10px 17px;
      border: 1px solid transparent;
      border-radius: 11px;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 750;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .error-action:hover {
      transform: translateY(-1px);
    }

    .error-action:focus-visible {
      outline: 3px solid rgba(182, 138, 36, 0.28);
      outline-offset: 2px;
    }

    .error-action--primary {
      background: var(--error-primary);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(33, 79, 112, 0.2);
    }

    .error-action--primary:hover {
      background: var(--error-primary-dark);
    }

    .error-action--secondary {
      border-color: var(--error-border);
      background: var(--error-surface-muted);
      color: var(--error-text);
    }

    .error-action--secondary:hover {
      border-color: #bbc4ca;
      background: #edf1f3;
    }

    .error-help {
      max-width: 500px;
      margin: 34px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--error-border);
      color: var(--error-muted);
      font-size: 0.76rem;
      line-height: 1.55;
    }

    @media (max-width: 760px) {
      .error-page {
        align-items: start;
        padding: 14px;
      }

      .error-card {
        min-height: 0;
        grid-template-columns: minmax(0, 1fr);
        border-radius: 22px;
      }

      .error-visual {
        min-height: 210px;
        padding: 25px;
      }

      .error-code-wrap {
        margin-top: 30px;
      }

      .error-code {
        font-size: clamp(5rem, 25vw, 6.5rem);
      }

      .error-content {
        padding: 34px 25px 30px;
      }

      .error-content h1 {
        overflow-wrap: anywhere;
        font-size: clamp(2rem, 10vw, 2.7rem);
      }
    }

    @media (max-width: 440px) {
      .error-page {
        padding: 0;
      }

      .error-card {
        border: 0;
        border-radius: 0;
      }

      .error-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .error-action {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .error-action {
        transition: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --error-background: #151a1e;
        --error-surface: #20262a;
        --error-surface-muted: #293035;
        --error-text: #f0ede8;
        --error-muted: #b2b8bc;
        --error-border: #384148;
        --error-shadow: rgba(0, 0, 0, 0.35);
      }

      .error-content h1 {
        color: #e7edf1;
      }

      .error-action--secondary:hover {
        border-color: #59636a;
        background: #30383d;
      }
    }
  </style>
</head>
<body data-page="error-{{ error_code }}">
  <main class="error-page">
    <section class="error-card" aria-labelledby="error-page-title">
      <div class="error-visual" aria-hidden="true">
        <div class="error-brand">
          <span class="error-brand__mark">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M7 9h10"/></svg>
          </span>
          <span class="error-brand__copy">
            <small>Župni ured</small>
            <strong>Pastoral</strong>
          </span>
        </div>
        <div class="error-code-wrap">
          <span class="error-code-label">Oznaka pogreške</span>
          <strong class="error-code">{{ error_code }}</strong>
        </div>
      </div>

      <div class="error-content">
        <p class="error-eyebrow">Ne možemo otvoriti traženu stranicu</p>
        <h1 id="error-page-title">{{ page_title }}</h1>
        <p class="error-message">{{ error_message }}</p>

        <div class="error-actions">
          <a href="{{ home_url }}" class="error-action error-action--primary">Povratak na početnu</a>
          {% if show_reload_action %}
            <button type="button" class="error-action error-action--secondary" onclick="window.location.reload()">Pokušaj ponovno</button>
          {% endif %}
        </div>

        <p class="error-help">Ako trebate pomoć, navedite samo oznaku pogreške {{ error_code }}. Nemojte slati osobne podatke župljana.</p>
      </div>
    </section>
  </main>
</body>
</html>
