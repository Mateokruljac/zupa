{% extends "admin/change_list.html" %}

{% block object-tools-items %}
<li>
  <a href="{% url 'admin:liturgija_liturgicalcalendarentry_import_romcal' %}" class="addlink">
    Uvezi rimski kalendar
  </a>
</li>
<li>
  <a href="#" class="addlink" id="litcal-import-byzantine">
    Uvezi bizantski kalendar
  </a>
  <script>
  document.getElementById("litcal-import-byzantine")?.addEventListener("click", function (event) {
    event.preventDefault();
    if (window.Swal) {
      window.Swal.fire({
        title: "Bizantski kalendar",
        text: "Još nije implementirano.",
        icon: "info",
        confirmButtonText: "U redu",
        heightAuto: false,
      });
      return;
    }
    window.alert("Još nije implementirano");
  });
  </script>
</li>
{{ block.super }}
{% endblock %}
