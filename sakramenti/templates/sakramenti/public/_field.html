<div class="form-group{% if field.field.widget.attrs.rows %} form-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="card-sub">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
  {% endif %}
</div>
