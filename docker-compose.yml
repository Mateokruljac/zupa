version: "3.9"

services:
  db:
    image: postgres
    volumes:
      - zupa_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-zupa}
      - POSTGRES_USER=${DB_USER:-zupa}
      - POSTGRES_PASSWORD=${DB_PASS:-zupa}
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_HOST=${DB_HOST:-db}

    ports:
      - ${DB_PORT:-5432}:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-zupa}" ]
      interval: 2s
      timeout: 5s
      retries: 5
    command: [ "postgres", "-c", "log_statement=${POSTGRES_LOG_LEVEL:-all}" ]
    networks:
      - zupa
    restart: unless-stopped

  cache:
    image: redis:6.2-alpine
    restart: always
    networks:
      - zupa
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass  ${REDIS_PASSWORD:-password}
    volumes:
      - cache:/data

  celery:
    build: .
    command: celery -A zupa worker -l info
    volumes:
      - .:/code
    depends_on:
      - db
      - cache
      - mailhog
    env_file:
      - .env
    environment:
      MAILHOG_SMTP_HOST: mailhog
      MAILHOG_SMTP_PORT: "1025"
      EMAIL_USE_TLS: "False"
      CELERY_BROKER_URL: redis://:password@cache:6379/0
      CELERY_RESULT_BACKEND: redis://:password@cache:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    networks:
      - zupa
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A zupa beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/code
    depends_on:
      - db
      - cache
      - web
    env_file:
      - .env
    networks:
      - zupa

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MAILHOG_SMTP_HOST: mailhog
      MAILHOG_SMTP_PORT: "1025"
      EMAIL_USE_TLS: "False"
      CELERY_BROKER_URL: redis://:password@cache:6379/0
      CELERY_RESULT_BACKEND: redis://:password@cache:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      mailhog:
        condition: service_started
      celery:
        condition: service_started
    networks:
      - zupa
    restart: unless-stopped
  mailhog:
    image: 'mailhog/mailhog:latest'
    ports:
      - ${MAILHOG_SMTP_PORT:-1025}:1025
      - ${MAILHOG_WEB_PORT:-8025}:8025
    networks:
      - zupa
networks:
  zupa:
volumes:
  zupa_db:
  cache: