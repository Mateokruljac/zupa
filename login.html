<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava — Pastoral</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/parish-config.js"></script>
  <script src="js/theme-picker.js"></script>
  <script>try{PastoralTheme.applyFromSettings(PastoralParish.loadSettings())}catch(e){}</script>
  <script src="js/data-seed.js"></script>
</head>
<body data-page="login" class="auth-page">
  <div class="auth-card" style="max-width:400px">
    <div style="text-align:center;margin-bottom:20px" id="login-logo"></div>
    <h1>Župna administracija</h1>
    <p style="color:var(--text-muted);font-size:0.9rem;margin:0">Župa Blažene Djevice Marije · Slavonski Brod</p>
    <form id="login-form" style="margin-top:24px">
      <div class="form-group">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" value="ured@zupa-bdm-sb.hr" required>
      </div>
      <div class="form-group">
        <label for="login-role">Uloga</label>
        <select id="login-role">
          <option value="zupnik">Župnik</option>
          <option value="vikar">Vikar</option>
          <option value="upravitelj">Župni upravitelj</option>
          <option value="kateheta">Kateheta</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Uđi u administraciju</button>
    </form>
    <p style="margin-top:20px;text-align:center;font-size:0.9rem;color:var(--text-muted)">
      <a href="public/index.html">Javni obrasci</a> — krizma, krštenje, pričest, ukop
    </p>
  </div>
  <footer class="auth-footer card-sub" style="margin-top:32px;text-align:center">
    Pastoral · župna administracija (demo)
  </footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const m = document.getElementById("login-logo");
      if (m && window.PastoralParish) {
        PastoralParish.applyTheme();
        m.innerHTML = PastoralParish.renderLogoHtml(true);
      }
    });
  </script>
  <script src="js/modal-kit.js"></script>
  <script src="js/onboarding-tour.js"></script>
  <script src="js/priest-tools.js"></script>
  <script src="js/crud-modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
